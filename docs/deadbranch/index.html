<title>Dead Branch — prototype</title>
<meta name="description" content="Dead Branch is an educational word game for learning Lithuanian: build words from letters and watch them grow like molecules, with Russian translations. Play on a phone or a PC. / Обучающая игра для изучения литовского языка: собирай слова из букв, они растут молекулой. Играть можно на телефоне и на ПК.">
<style>
  :root { --bg:#070b12; --fg:#dff5ff; --dim:#6b8294; --ok:#4ade80; --bad:#f87171; --gold:#fbbf24; --sky:#38bdf8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:linear-gradient(#0f5a73, #04182b); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  body { display:flex; flex-direction:column; height:100dvh; max-width:470px; margin:0 auto; position:relative; background:transparent; box-shadow:0 0 50px #0007; }   /* phone-sized column: HUD, field and buttons share one width */
  #hud { position:absolute; top:0; left:0; right:0; z-index:5; display:flex; align-items:flex-start; gap:12px; padding:max(8px,env(safe-area-inset-top)) 12px 0; pointer-events:none; }
  #hud::before { content:""; position:absolute; z-index:-1; left:0; right:0; top:0; height:calc(100% + 40px); pointer-events:none;   /* frosted strip: whatever passes under the HUD is blurred and fades out */
    background:linear-gradient(rgba(4,24,43,.55), rgba(4,24,43,0)); 
    -webkit-mask-image:linear-gradient(#000 55%, transparent); mask-image:linear-gradient(#000 55%, transparent); }
  html.q-ultra #hud::before { -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px); }   /* only the top profile may blur what is under the header */
  html.lab #hud::before { background:linear-gradient(rgba(238,245,248,.8), rgba(238,245,248,0)); }
  #coords { position:absolute; left:12px; top:66px; z-index:5; pointer-events:none; font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.6px; white-space:pre; color:#d97706; opacity:.85; }
  #fps { position:absolute; left:12px; top:80px; z-index:5; pointer-events:none; font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre; color:#35566a; opacity:.8; }
  #coords.home { color:#13997c; opacity:.7; }
  #hud .big { font-size:26px; font-weight:700; line-height:1; }
  #hud .sub { white-space:nowrap; font-size:13px; color:#c3d9e6; margin-top:3px; display:flex; align-items:center; gap:5px; text-shadow:0 1px 2px #0008; }
  #hud .sub svg { width:14px; height:14px; color:#86efac; margin-right:-2px; }
  #hud .grow { flex:1; }
  #dens { height:8px; border-radius:3px; background:#12202e; overflow:hidden; margin-top:8px; }
  #dens > i { display:block; height:100%; width:0; background:var(--sky); transition:width .2s, background .2s; }
  #gear, #helpb { pointer-events:auto; background:#10202e; border:1px solid #1d3547; color:var(--fg); border-radius:12px; width:44px; height:44px; font-size:20px; }
  /* wide screens (a monitor, 16:9): the canvas and the laboratory fill the window, the play column sits in the middle */
  html.wide body { max-width:none; box-shadow:none; }
  html.wide #hud { left:50%; right:auto; width:min(560px,100%); transform:translateX(-50%); }
  html.wide #coords, html.wide #fps { left:calc(50% - 280px + 12px); }
  html.wide #panel { right:calc(50% - 280px + 10px); }
  html.wide #hintpanel { left:calc(50% - 280px + 8px); right:calc(50% - 280px + 8px); }
  html.wide #tray > * { width:min(560px,100%); align-self:center; }
  #helpb { font-size:20px; font-weight:700; }
  #help { position:absolute; inset:0; z-index:12; display:none; background:#050a10f5; }
  #help.open { display:block; }
  #help .card { height:100%; overflow:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; user-select:text; padding:max(16px,env(safe-area-inset-top)) 18px 90px; max-width:600px; margin:0 auto; font-size:16px; line-height:1.5; }
  #help h2 { margin:0 0 10px; font-size:26px; } #help h3 { margin:18px 0 6px; font-size:17px; color:var(--sky); }
  #help p { margin:0 0 8px; } #help ul, #help ol { margin:0 0 8px; padding-left:22px; } #help li { margin:0 0 5px; }
  #help .lg { display:grid; grid-template-columns:64px 1fr; gap:6px 12px; margin:0 0 8px; } #help .lg b { font-size:17px; color:var(--gold); white-space:nowrap; }
  #helpok { position:absolute; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); transform:translateX(-50%); min-width:220px; height:48px; }
  html.lab #help { background:#eef5f8f7; color:#12303f; } html.lab #help h3 { color:#1b7cb8; } html.lab #help .lg b { color:#b45309; }
  #panel { position:absolute; top:52px; right:10px; z-index:6; background:#0c1722f2; border:1px solid #1d3547; border-radius:12px; padding:12px; display:none; min-width:220px; font-size:14px; }
  #panel.open { display:block; }
  #panel label { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:6px 0; }
  #panel select, #panel button { background:#10202e; color:var(--fg); border:1px solid #1d3547; border-radius:8px; padding:6px 8px; font-size:14px; }
  canvas { flex:1; min-height:0; width:100%; display:block; }
  #tray { flex:none; display:flex; flex-direction:column-reverse; gap:6px; padding:6px 12px max(14px,env(safe-area-inset-bottom)); background:#0a121b; border-top:1px solid #1a2b3a; }
  #wzone { height:36px; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:10px; min-width:0; }
  #word { flex:none; max-width:55%; height:34px; line-height:34px; text-align:center; font-size:26px; font-weight:700; letter-spacing:2px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:clip; }
  #sub { display:flex; align-items:center; justify-content:flex-start; gap:8px; flex:1 1 0; height:30px; min-width:0; }
  #ru { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:400; color:#b4d3e6; }
  #ru:empty { display:none; }
  .chip { flex:none; position:relative; overflow:hidden; height:30px; padding:0 12px; border-radius:15px; border:1px solid #2a4a62; background:#12263a; color:var(--fg); font-size:13px; font-weight:600; }
  .chip[hidden] { display:none; }
  #back { position:relative; overflow:hidden; }
  #back i { position:absolute; inset:0 auto 0 0; width:0; background:#0a6a8040; }
  #back.hold i { width:100%; transition:width .65s linear; }   /* a fill shows how long to hold */
  #back svg { position:relative; }
  #btns { display:flex; gap:8px; justify-content:flex-end; }
  #btns .btn { height:32px; border-radius:11px; }
  .btn.ic { flex:none; width:48px; padding:0; display:flex; align-items:center; justify-content:center; }
  .btn.ic svg { width:20px; height:20px; }
  #go { flex:0 0 112px; font-size:17px; padding:0 10px; }   /* about half the old length; the group sits on the side of the thumb */
  body.lefty #btns { flex-direction:row-reverse; }
  #bs { color:#7f95a7; } #ls { color:var(--fg); }
  #word.word #ls { color:var(--ok); } #word.dead #ls { color:var(--bad); }
  #word .hint { color:#8aa3b5; font-size:16px; font-weight:400; letter-spacing:0; text-transform:none; }
  .btn { border:0; border-radius:14px; height:48px; min-width:48px; padding:0 14px; font-size:16px; font-weight:700; color:#06111a; background:var(--sky); }
  .btn.sec { background:#16304a; color:var(--fg); border:1px solid #1f3a50; }
  .btn.go { background:var(--ok); padding:0 18px; box-shadow:0 0 16px #4ade8033; }
  .btn:disabled { opacity:.35; }
  #hintpanel { position:absolute; top:86px; left:8px; right:8px; z-index:9; max-height:42%; overflow:auto; display:none; background:#070c12ea; border:1px solid #1d3547; border-radius:10px; padding:12px 56px 12px 14px; font-size:17px; line-height:1.6; pointer-events:auto; }
  #hintx { position:absolute; top:6px; right:6px; width:42px; height:42px; border-radius:21px; border:1px solid #1d3547; background:#10202e; color:#dff5ff; font-size:26px; line-height:1; padding:0; }   /* the panel can be closed at once */
  #hintpanel.open { display:block; } #hintpanel b { color:var(--ok); } #hintpanel .fin b { color:var(--gold); } #hintpanel i { color:#bbf7d0; font-style:normal; }
  #cd { position:absolute; top:46px; left:0; right:0; z-index:5; text-align:center; font-size:20px; font-weight:800; color:var(--bad); text-shadow:0 0 12px #f8717199; pointer-events:none; display:none; }
  #cd.open { display:block; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  #toasts { position:absolute; top:70px; left:0; right:0; z-index:5; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
  .toast { background:#0b1824e6; border:1px solid #1d3547; padding:6px 12px; border-radius:999px; font-size:15px; font-weight:600; animation:fade 2s forwards; }
  .toast.ok { color:var(--ok); } .toast.bad { color:var(--bad); } .toast.gold { color:var(--gold); }
  @keyframes fade { 0% { opacity:0; transform:translateY(-6px);} 10% { opacity:1; transform:none;} 80% { opacity:1;} 100% { opacity:0;} }
  #over { position:absolute; inset:0; z-index:9; background:#050a10e6; display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; text-align:center; }
  #over.open { display:flex; }
  /* the laboratory look */
  html.lab { background:linear-gradient(#eef5f8,#3b7ba6); color:#12303f; }
  html.lab body { color:#12303f; box-shadow:0 0 50px #4a6b7e55; }
  html.lab #hud .sub { color:#35566a; text-shadow:0 1px 0 #fff9; } html.lab #hud .sub svg { color:#13997c; }
  html.lab #hud .big { color:#0f2f44; text-shadow:0 1px 0 #fff9; } html.lab #dens { background:#bcd0db; }
  html.lab #gear, html.lab #helpb { background:#ffffffb8; border-color:#9bb8c8; color:#0f2f44; }
  html.lab #panel { background:#ffffffee; border-color:#9bb8c8; color:#0f2f44; }
  html.lab #panel select, html.lab #panel button { background:#fff; color:#0f2f44; border-color:#9bb8c8; }
  html.lab #tray { background:#eef5f8f2; border-top-color:#b9cfdb; }
  html.lab #bs { color:#6f8796; } html.lab #ls { color:#0f2f44; } html.lab #word.word #ls { color:#15803d; } html.lab #word.dead #ls { color:#dc2626; }
  html.lab #word .hint { color:#58707f; } html.lab #ru { color:#3d5a6b; }
  html.lab .chip { background:#fff; border-color:#9bb8c8; color:#0f2f44; }
  html.lab .btn.sec { background:#fff; color:#0f2f44; border-color:#9bb8c8; }
  html.lab .btn.go { background:linear-gradient(#37b1e6,#1b7cb8); color:#fff; box-shadow:0 2px 10px #1b7cb855; }
  html.lab .btn:disabled { opacity:.5; }
  html.lab .toast { background:#fffffff0; border-color:#9bb8c8; } html.lab .toast.ok { color:#15803d; } html.lab .toast.bad { color:#dc2626; } html.lab .toast.gold { color:#b45309; }
  html.lab #cd { color:#dc2626; text-shadow:none; }
  html.lab #hintx { background:#fff; color:#0f2f44; border-color:#9bb8c8; }
  html.lab #hintpanel { background:#fffffff7; box-shadow:0 6px 20px #2a4a6a33; border-color:#9bb8c8; color:#0f2f44; } html.lab #hintpanel b { color:#15803d; } html.lab #hintpanel .fin b { color:#b45309; } html.lab #hintpanel i { color:#0f766e; }
  html.lab #over { background:#e8f1f5ee; color:#0f2f44; } html.lab #over .score { color:#b45309; }
  #over h1 { margin:0; font-size:30px; } #over .score { font-size:46px; font-weight:800; color:var(--gold); }
</style>
</head>

<body>
<div id="hud">
  <div><div class="big" id="score">0</div><div class="sub"><span id="diff" data-i18n-title="t_diff"></span><span>·</span><span id="streak" data-i18n-title="t_streak">×1.0</span><span>·</span><span><span data-i18n="words"></span> <span id="wn">0</span></span><span>·</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14zM5 19l7-7"/></svg><span id="tn" data-i18n-title="t_branches">0</span></div></div>
  <div class="grow"><div class="sub" style="justify-content:flex-end"><span data-i18n="pressure"></span> <b id="denst">0%</b></div><div id="dens"><i></i></div></div>

      ctx.globalAlpha = 1; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.font = "500 " + Math.round(fs * .78) + "px system-ui,sans-serif";
      const pw = Math.max(bw + 20, ctx.measureText(tr("ripeSub")).width + 28);   // a pill behind the text keeps it readable over words
      ctx.fillStyle = T.lab ? "rgba(255,255,255,.86)" : "rgba(5,12,20,.7)"; ctx.beginPath(); rrPath(cx - pw / 2, cy - fs * 1.45, pw, fs * 3.2, fs * .7); ctx.fill();
      ctx.fillStyle = T.ripeTitle; ctx.font = "700 " + fs + "px system-ui,sans-serif";
      ctx.fillText("🌿 " + tr("ripeTitle", left.toFixed(1)), cx, cy);
      ctx.fillStyle = T.ripeSub; ctx.font = "500 " + Math.round(fs * .78) + "px system-ui,sans-serif";
      ctx.fillText(tr("ripeSub"), cx, cy + fs * 1.25);
      ctx.fillStyle = T.barBg; ctx.fillRect(cx - bw / 2, cy + fs * 1.45, bw, 4);
      ctx.fillStyle = T.barFg; ctx.fillRect(cx - bw / 2, cy + fs * 1.45, bw * (left / ripeT()), 4);
    }
    ctx.globalAlpha = 1;
  }

  }
  drawTrees(t => !isBg(t));
  ctx.globalAlpha = 1; for (const f of late) f();
  ctx.restore();

  drawIdle(cw, wy, rr);
  drawOrbit(cw, wy, SX, SY, ks);

  // picked letters fly from the swarm to their places in the new word
  for (const f of G.fx) {
    const p = f.t / .9, e = 1 - Math.pow(1 - Math.min(1, p * 1.6), 2);
    f.from.forEach((l, i) => {
      const to = f.to[i]; if (!to) return;
      ctx.globalAlpha = Math.max(0, 1 - p) * .85;
      ctx.strokeStyle = T.fly[3]; ctx.lineWidth = 2;
      const x0 = l.field ? SX(l.x) : KX(l.x), y0 = l.field ? SY(l.y) : KY(l.y), x1 = SX(to.x), y1 = SY(to.y);   // from the band (or from a floating letter) to the field
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      glyph(x0 + (x1 - x0) * e, y0 + (y1 - y0) * e, R * ks + (rr * LRK - R * ks) * e, l.ch, T.fly[0], T.fly[1], T.fly[2], 2);
    });
    ctx.globalAlpha = 1;
  }
}

let last = performance.now();
let lastDraw = 0;
const fpsStat = { n: 0, ms: 0, t0: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  if (now - lastDraw < 1000 / Q.fps - 3) return;   // the quality profile caps the frame rate (fewer frames, less heat)
  lastDraw = now;
  { const d = cvDpr(); if (cv.width !== Math.round(cv.clientWidth * d) || cv.height !== Math.round(cv.clientHeight * d)) resize(); }
  const dt = Math.min(.04, (now - last) / 1000); last = now;
  const w0 = performance.now(); update(dt);
  try { draw(); } catch (e) { G.err = String((e && e.message) || e) + " @" + (String((e && e.stack) || "").split("\n")[1] || "").replace(/^.*[\/(]/, "").slice(0, 40); cv.width = cv.width; }   // an error in the middle of a frame leaves a clip on the canvas and old frames stop being erased: reset the canvas state and show the error in the FPS line
  const spent = performance.now() - w0;
  fpsStat.n++; fpsStat.ms += spent;
  if (now - fpsStat.t0 >= 500) {   // a small counter: frames per second, the time one frame costs the processor, the canvas size
    if ($("showfps").checked) setText($("fps"), "v" + VERSION + " \u00b7 FPS " + Math.round(fpsStat.n * 1000 / (now - fpsStat.t0)) + " \u00b7 " + (fpsStat.ms / Math.max(1, fpsStat.n)).toFixed(1) + " ms \u00b7 " + cv.width + "\u00d7" + cv.height + " \u00b7 " + $("quality").value + (G.err ? " \u00b7 ERR " + G.err : ""));
    else setText($("fps"), "");
    fpsStat.n = 0; fpsStat.ms = 0; fpsStat.t0 = now;
  }
}

/* ---------- autosave ---------- */
// The running game is written to localStorage every few seconds and when the page is hidden or closed, and restored on the next visit.
// Not saved: swarm letters (they drift back to their keys by themselves), effects, hints. A finished game leaves no save.
const SAVE_KEY = "db_save", SAVE_VER = 1;
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function readSave() { try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); return d && d.v === SAVE_VER ? d : null; } catch (e) { return null; } }
function saveGame() {
  if (G.over || !G.trees) return;
  try {
    const rec = n => ({ id: n.id, str: n.str, added: n.added, parent: n.parent ? n.parent.id : null, alive: n.alive, done: n.done, x: n.x, y: n.y, w: n.w, hh: n.hh, born: n.born, box: n.box, lets: n.lets, tilt: n.tilt, words: n.words || null });
    const b = G.builder;
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: SAVE_VER, tier: +$("tier").value, onlytr: $("onlytr").checked,
      W: G.W, H: G.H, tW: G.tW, tH: G.tH, score: G.score, streak: G.streak, wordsN: G.wordsN, agony: G.agony, t: G.t, pressureT: G.pressureT,
      usedVer: G.usedVer, dockOff: G.dockOff, harvested: G.harvested, used: [...G.used], dead: G.dead,
      trees: G.trees.map(t => ({ pts: t.pts, harvest: t.harvest, t: t.t, ripe: t.ripe, ripeT: t.ripeT, bb: t.bb || null, dock: t.dock || null, nodes: t.nodes.map(rec) })),
      builder: { base: b.base ? b.base.id : null, letters: b.letters, rootX: b.rootX, newMode: b.newMode }
    }));
  } catch (e) {}
}
function restoreGame(d) {
  const byId = new Map();
  G.trees = d.trees.map(td => {
    const t = { nodes: [], pts: td.pts, harvest: td.harvest, t: td.t, ripe: td.ripe, ripeT: td.ripeT };
    if (td.bb) t.bb = td.bb;
    if (td.dock) t.dock = td.dock;
    for (const r of td.nodes) {
      const n = { ...r, parent: r.parent == null ? null : byId.get(r.parent) || null, children: [], tree: t };   // parents always come before their children
      if (n.parent) n.parent.children.push(n);
      byId.set(n.id, n); t.nodes.push(n); nodeId = Math.max(nodeId, n.id + 1);
    }
    return t;
  });
  Object.assign(G, { W: d.W, H: d.H, tW: d.tW, tH: d.tH, score: d.score, streak: d.streak, wordsN: d.wordsN, agony: d.agony, t: d.t, pressureT: d.pressureT,
    usedVer: d.usedVer, dockOff: d.dockOff, harvested: d.harvested, used: new Set(d.used), dead: d.dead });
  const b = G.builder, sb = d.builder;
  b.base = sb.base == null ? null : byId.get(sb.base) || null;
  b.letters = sb.letters.filter(ch => G.swarm.some(l => l.ch === ch)); b.src = b.letters.map(ch => G.swarm.find(l => l.ch === ch));
  b.rootX = sb.rootX; b.newMode = sb.newMode;
  ensureBase(); updateTray(); updateHud();
}
const SET_IDS = ["tier", "agony", "ripe", "assist", "quality"], SET_CHECKS = ["onlytr", "hints", "haptics", "pressure", "fsauto", "showfps"];
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem("db_settings") || "{}");
    for (const id of SET_IDS) if (s[id] != null && [...$(id).options].some(o => o.value === s[id])) $(id).value = s[id];
    for (const id of SET_CHECKS) if (typeof s[id] === "boolean") $(id).checked = s[id];
  } catch (e) {}
}
function saveSettings() {
  const s = {}; for (const id of SET_IDS) s[id] = $(id).value; for (const id of SET_CHECKS) s[id] = $(id).checked;
  try { localStorage.setItem("db_settings", JSON.stringify(s)); } catch (e) {}
}
for (const id of [...SET_IDS, ...SET_CHECKS]) $(id).addEventListener("change", saveSettings);
// full screen (Android Chrome and desktop browsers; iPhone has no such API: use "Add to Home Screen" there)
const canFS = !!document.documentElement.requestFullscreen;
function goFullscreen() {
  if (!canFS || document.fullscreenElement) return;
  document.documentElement.requestFullscreen({ navigationUI: "hide" }).then(() => { try { screen.orientation.lock("portrait").catch(() => {}); } catch (e) {} }).catch(() => {});
}
function toggleFullscreen() { if (document.fullscreenElement) document.exitFullscreen(); else goFullscreen(); }
if (!canFS) { $("fs").style.display = "none"; $("fsauto").parentElement.style.display = "none"; }
$("fs").onclick = () => { toggleFullscreen(); $("panel").classList.remove("open"); };
document.addEventListener("pointerdown", () => { if ($("fsauto").checked) goFullscreen(); }, true);   // browsers allow it only from a tap
setInterval(saveGame, 3000);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveGame(); });
window.addEventListener("pagehide", saveGame);

/* ---------- boot ---------- */
loadSettings();
$("lang").value = LANG; applyLang();
const openHelp = () => { $("help").classList.add("open"); $("help").querySelector(".card").scrollTop = 0; };
const closeHelp = () => { $("help").classList.remove("open"); try { localStorage.setItem("db_help", "1"); } catch (e) {} };
$("helpb").onclick = openHelp; $("helpok").onclick = closeHelp;
{ let seen = false; try { seen = !!localStorage.getItem("db_help"); } catch (e) {} if (!seen) openHelp(); }
$("lang").onchange = () => { LANG = $("lang").value; try { localStorage.setItem("db_lang", LANG); } catch (e) {} applyLang(); updateTray(); updateDiff(); };
{ let stored = null; try { stored = JSON.parse(localStorage.getItem("db_settings") || "{}").quality; } catch (e) {}
  if (!stored) $("quality").value = "high"; }   // everyone starts on High (the light profile looked blurry)
applyQuality();
const SAVED = readSave();   // read before reset(), which clears the stored game
buildLex(+$("tier").value);
reset(); layoutMode(); updateDiff();
if (SAVED && SAVED.tier === +$("tier").value && SAVED.onlytr === $("onlytr").checked) { restoreGame(SAVED); saveGame(); toast(tr("restored"), "gold"); }
$("ver").textContent = "Dead Branch v" + VERSION;
requestAnimationFrame(frame);
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(() => {});   // an offline copy once it has been opened with a network
window.__dbg = { G, cam, step: dt => { update(dt); draw(); }, commit, WORDS: () => WORDS, PRE: () => PRE, reset };
</script>
